org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official

# --- WASH Mesh : URLs et secrets injectés en BuildConfig ---
# Émulateur : 10.0.2.2 = localhost du PC. Au village : IP LAN du relai/serveur.
LARAVEL_API_URL=http://10.0.2.2/api
RELAY_URL=http://10.0.2.2:8001
# Clé X-Mesh-Key (vide = ingestion publique + quotas, cf. backend/.env MESH_INGEST_KEY).
MESH_RELAY_KEY=
# Secret partagé passerelle SMS (cf. backend/.env MESH_SMS_SECRET).
MESH_SMS_SECRET=change-moi
# Allowlist CSV des expéditeurs SMS (vide = tous acceptés, cf. MESH_SMS_ALLOWLIST).
MESH_SMS_ALLOWLIST=
# Quota journalier local par expéditeur (cf. MESH_SMS_QUOTA_PER_SENDER, défaut 10).
MESH_SMS_QUOTA_PER_SENDER=10
