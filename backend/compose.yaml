services:
    laravel.app:
        image: 'serversideup/php:8.3-fpm-nginx'
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:8080'
        environment:
            AUTORUN_ENABLED: 'true'
            PHP_OPCACHE_ENABLE: '0'
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: '${DB_DATABASE:-wash_sentinel}'
            DB_USERNAME: '${DB_USERNAME:-sentinel_user}'
            DB_PASSWORD: '${DB_PASSWORD:-secret_sentinel}'
            AI_ENGINE_URL: 'http://ai-engine:8000'
        volumes:
            - '.:/var/www/html'
        networks:
            - wash-network
        depends_on:
            - pgsql
            - ai-engine

    pgsql:
        image: 'postgres:16-alpine'
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-wash_sentinel}'
            POSTGRES_USER: '${DB_USERNAME:-sentinel_user}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret_sentinel}'
        volumes:
            - 'wash-pgsql:/var/lib/postgresql/data'
        networks:
            - wash-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sentinel_user} -d ${DB_DATABASE:-wash_sentinel}"]
            interval: 5s
            timeout: 5s
            retries: 5

    ai-engine:
        build:
            context: ./ai-engine
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - '${FORWARD_AI_PORT:-8000}:8000'
        environment:
            OLLAMA_URL: '${OLLAMA_URL:-http://ollama:11434}'
            OLLAMA_MODEL: '${OLLAMA_MODEL:-llama3.2:3b}'
            OLLAMA_VISION_MODEL: '${OLLAMA_VISION_MODEL:-llama3.2-vision:11b}'
            OLLAMA_EMBED_MODEL: '${OLLAMA_EMBED_MODEL:-nomic-embed-text}'
            VOICE_STT_BINARY: '/opt/voice/bin/whisper-cli'
            VOICE_STT_MODEL: '/models/whisper/ggml-base.bin'
        networks:
            - wash-network
        depends_on:
            - ollama

    ollama:
        image: 'ollama/ollama:latest'
        restart: unless-stopped
        ports:
            - '${FORWARD_OLLAMA_PORT:-11434}:11434'
        volumes:
            - 'wash-ollama:/root/.ollama'
        networks:
            - wash-network

networks:
    wash-network:
        driver: bridge

volumes:
    wash-pgsql:
        driver: local
    wash-ollama:
        driver: local
