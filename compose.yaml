# WASH Sentinel — pile complète : Laravel + worker + PostgreSQL + moteur IA + Ollama + frontend.
# Démarrage : ./start.sh | Arrêt : ./stop.sh
services:
    laravel:
        image: 'serversideup/php:8.3-fpm-nginx'
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:8080'
        environment:
            AUTORUN_ENABLED: 'true'
            PHP_OPCACHE_ENABLE: '0'
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: '${DB_DATABASE:-wash_sentinel}'
            DB_USERNAME: '${DB_USERNAME:-sentinel_user}'
            DB_PASSWORD: '${DB_PASSWORD:-secret_sentinel}'
            AI_ENGINE_URL: 'http://ai-engine:8000'
        volumes:
            - './backend:/var/www/html'
        networks:
            - wash-network
        depends_on:
            pgsql:
                condition: service_healthy
            ai-engine:
                condition: service_started

    queue:
        image: 'serversideup/php:8.3-fpm-nginx'
        restart: unless-stopped
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
        # Pas de serveur web ici : on desactive le healthcheck HTTP herite de l'image.
        healthcheck:
            test: ["NONE"]
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: '${DB_DATABASE:-wash_sentinel}'
            DB_USERNAME: '${DB_USERNAME:-sentinel_user}'
            DB_PASSWORD: '${DB_PASSWORD:-secret_sentinel}'
            AI_ENGINE_URL: 'http://ai-engine:8000'
        volumes:
            - './backend:/var/www/html'
        networks:
            - wash-network
        depends_on:
            pgsql:
                condition: service_healthy

    pgsql:
        image: 'postgres:16-alpine'
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-wash_sentinel}'
            POSTGRES_USER: '${DB_USERNAME:-sentinel_user}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret_sentinel}'
        volumes:
            - 'wash-pgsql:/var/lib/postgresql/data'
        networks:
            - wash-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sentinel_user} -d ${DB_DATABASE:-wash_sentinel}"]
            interval: 5s
            timeout: 5s
            retries: 5

    ai-engine:
        build:
            context: ./backend/ai-engine
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - '${FORWARD_AI_PORT:-8000}:8000'
        environment:
            OLLAMA_URL: '${OLLAMA_URL:-http://ollama:11434}'
            OLLAMA_MODEL: '${OLLAMA_MODEL:-llama3.2:3b}'
            OLLAMA_VISION_MODEL: '${OLLAMA_VISION_MODEL:-llama3.2-vision:11b}'
            OLLAMA_EMBED_MODEL: '${OLLAMA_EMBED_MODEL:-nomic-embed-text}'
            STT_DRIVER: '${STT_DRIVER:-whisper_cpp}'
            OMNI_STT_MODEL: '/models/omnilingual/model.int8.onnx'
            OMNI_STT_TOKENS: '/models/omnilingual/tokens.txt'
            VOICE_STT_BINARY: '/opt/voice/bin/whisper-cli'
            VOICE_STT_MODEL: '/models/whisper/ggml-base.bin'
        volumes:
            - './models:/models'
        networks:
            - wash-network
        depends_on:
            ollama:
                condition: service_started
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    ollama:
        image: 'ollama/ollama:latest'
        restart: unless-stopped
        ports:
            - '${FORWARD_OLLAMA_PORT:-11434}:11434'
        volumes:
            - 'wash-ollama:/root/.ollama'
        networks:
            - wash-network
        healthcheck:
            test: ["CMD", "ollama", "list"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 15s
        # GPU optionnel (2 Go de VRAM suffisent pour llama3.2:3b) :
        # deploy:
        #     resources:
        #         reservations:
        #             devices:
        #                 - driver: nvidia
        #                   count: 1
        #                   capabilities: [gpu]

    mesh-relay:
        build:
            context: ./mesh/server
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - '${FORWARD_MESH_PORT:-8001}:8001'
        environment:
            LARAVEL_URL: 'http://laravel:8080'
        networks:
            - wash-network
        depends_on:
            - laravel
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

    frontend:
        image: 'node:22-alpine'
        restart: unless-stopped
        working_dir: /app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
        ports:
            - '${FRONTEND_PORT:-5173}:5173'
        environment:
            VITE_API_URL: '${VITE_API_URL:-http://localhost/api}'
        volumes:
            - './frontend:/app'
            - 'wash-frontend-modules:/app/node_modules'
        networks:
            - wash-network
        depends_on:
            - laravel

networks:
    wash-network:
        driver: bridge

volumes:
    wash-pgsql:
        driver: local
    wash-ollama:
        driver: local
    wash-frontend-modules:
        driver: local
