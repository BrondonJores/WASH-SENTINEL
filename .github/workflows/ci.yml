name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, sqlite3, pdo_sqlite
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: php artisan test
        working-directory: backend

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: mesh/server
      - run: python -m pytest test_relay.py -q
        working-directory: mesh/server

  ai-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi httpx pydantic pytest
      - run: python -m pytest tests/ -q
        working-directory: backend/ai-engine

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Vérifier la synchronisation du SDK mesh vendored
        run: diff mesh/sdk/mesh-sdk.ts <(tail -n +5 frontend/src/lib/mesh-sdk.ts)
      - run: npm run build
        working-directory: frontend

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: gradle wrapper --gradle-version 8.7
        working-directory: mesh/android
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: mesh/android
      - uses: actions/upload-artifact@v4
        with:
          name: wash-relai-apk
          path: mesh/android/app/build/outputs/apk/debug/app-debug.apk
